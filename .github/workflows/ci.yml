name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  test:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Workers runtime tests (synthetic services)
        run: npm run test:runtime
      - name: Synthetic notification demonstration
        run: npm run test:mock
      - name: Wrangler build dry run
        run: npm run build
